name: CI/CD Pipeline & Deployment Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. ENGINE UNIT TESTS
  # =========================================================================
  test-engine:
    name: Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run Engine Test Suite
        run: npm run test:engine

  # =========================================================================
  # 2. SERVER INTEGRATION TESTS
  # =========================================================================
  test-server:
    name: Server Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: budget_planner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/budget_planner_ci
      SESSION_SECRET: ci_session_secret_for_testing
      SESSION_MAX_AGE_DAYS: 14
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Bootstrap Database Schema & Migrations
        run: npm run db:prepare --workspace=@budget/server
      - name: Run Server Integration Suite
        run: npm run test:server

  # =========================================================================
  # 3. WEB COMPONENT TESTS
  # =========================================================================
  test-web:
    name: Web Component & UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run Web Component Suite
        run: npm run test:web

  # =========================================================================
  # 4. WEB PRODUCTION BUILD VERIFICATION
  # =========================================================================
  build-web:
    name: Web Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build Web Application
        run: npm run build:web
      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 2

  # =========================================================================
  # 4b. MOBILE (FLUTTER): ENCODING GUARD, ANALYZE, TEST, RELEASE BUILD
  # =========================================================================
  # `flutter analyze` silently skips a UTF-16 .dart file, so a broken
  # main.dart once passed analysis. The encoding guard and the release build
  # are what catch that class of break. Not a deploy gate: Vercel ships the
  # web app and server only.
  mobile:
    name: Mobile (Flutter) Analyze, Test & Release Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Reject source files that are not UTF-8
        working-directory: .
        run: |
          python3 - <<'PY'
          import subprocess, sys
          exts = ('.dart', '.kt', '.kts', '.gradle', '.xml', '.yaml', '.yml', '.json', '.swift', '.js', '.jsx', '.md')
          files = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines()
          bad = []
          for path in files:
              if not path.endswith(exts):
                  continue
              data = open(path, 'rb').read()
              if b'\x00' in data:
                  bad.append(f'{path}: contains NUL bytes (UTF-16/32?)')
                  continue
              try:
                  data.decode('utf-8')
              except UnicodeDecodeError as e:
                  bad.append(f'{path}: not valid UTF-8 ({e})')
          if bad:
              print('Source files must be UTF-8:')
              print('\n'.join(bad))
              sys.exit(1)
          print('All source files are UTF-8.')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

      - name: Release APK build
        # Signs with the debug key unless ANDROID_KEYSTORE_* secrets are set
        # (see android/app/build.gradle.kts). This step checks that the app
        # compiles; it does not produce a Play upload.
        run: flutter build apk --release

  # =========================================================================
  # 5. SERVER BOOT & HEALTH CHECK E2E PROBE
  # =========================================================================
  e2e-health:
    name: Server Boot & Health Check
    needs: [test-engine, test-server, test-web, build-web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: budget_planner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/budget_planner_ci
      SESSION_SECRET: ci_session_secret_production_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Bootstrap Database Schema & Migrations
        run: npm run db:prepare --workspace=@budget/server
      - name: Verify Live TCP Binding & Health Probe
        run: |
          mkdir -p logs
          node apps/server/src/index.js > logs/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID. Polling http://127.0.0.1:4000/api/health..."
          
          SUCCESS=0
          for i in {1..30}; do
            RESPONSE=$(curl -s http://127.0.0.1:4000/api/health || true)
            echo "Attempt $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "Server health check passed on port 4000!"
              SUCCESS=1
              break
            fi
            sleep 1
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "ERROR: Server failed to accept TCP connections or respond to /api/health!"
            echo "--- Server Log Output ---"
            cat logs/server.log
            kill -9 $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          
          kill -15 $SERVER_PID 2>/dev/null || kill -9 $SERVER_PID 2>/dev/null || true

  # =========================================================================
  # 6. DEPLOYMENT GATE: DEPLOY TO VERCEL ONLY IF ALL TESTS PASS
  # =========================================================================
  deploy:
    name: Production Deployment Gate (Vercel)
    needs: [test-engine, test-server, test-web, build-web, e2e-health]
    runs-on: ubuntu-latest
    # STRICT GATE: Only runs on push to production branches when all 5 jobs succeed
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_fqAioDLH36fDzATI1CqRfLyy' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_PJWIkUj67A3VHumXvRAyDirZbLRL' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Deployment Prerequisites
        run: |
          echo "============================================================"
          echo "  CI/CD PIPELINE DEPLOYMENT GATEWAY: ALL TESTS PASSED (100%)"
          echo "============================================================"
          echo "Engine Unit Tests:         PASS"
          echo "Server Integration Tests:   PASS"
          echo "Web Component Tests:        PASS"
          echo "Web Production Build:       PASS"
          echo "Server TCP Boot & Health:   PASS"
          echo "Target Branch:              ${{ github.ref_name }}"
          echo "Commit SHA:                 ${{ github.sha }}"
          echo "============================================================"

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Configuration
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts via Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod

      - name: Deploy Prebuilt Artifacts to Vercel Production
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod
